name: managely
description: "Managely — Practice before the stakes are real. AI-powered management conversation simulator."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Fonts / design
  google_fonts: ^6.2.1

  # Local persistence
  shared_preferences: ^2.2.3

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  http: ^1.2.2
  dio: ^5.7.0

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.1
  package_info_plus: ^10.2.1
  purchases_flutter: ^10.9.0
  purchases_ui_flutter: ^10.9.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  fl_chart: ^1.2.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/google.png
    - assets/illustrations/paperplane.png
    - assets/illustrations/dumbell.png
    - assets/icons/premium.png
